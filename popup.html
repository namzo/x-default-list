<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X.com Tab Selector</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            margin: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e1e8ed;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #14171a;
            font-weight: 700;
        }
        
        .header p {
            margin: 5px 0 0 0;
            font-size: 12px;
            color: #657786;
        }
        
        .option-group {
            margin-bottom: 8px;
        }
        
        .option {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            padding: 4px 0;
        }
        
        .indented-options-container {
            position: relative;
            margin-left: 12px;
        }
        
        .indented-options-container::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #e1e8ed;
            border-radius: 1px;
        }
        
        .option.indented {
            padding-left: 12px;
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
            background-color: #ccc;
            border-radius: 10px;
            transition: background-color 0.3s;
            cursor: pointer;
        }
        
        .toggle-switch.active {
            background-color: #1da1f2;
        }
        
        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        
        .toggle-switch.active .toggle-slider {
            transform: translateX(16px);
        }
        
        .option label {
            font-size: 14px;
            color: #14171a;
            cursor: pointer;
            flex: 1;
        }
        
        .option.disabled {
            display: none;
        }
        

        

    </style>
</head>
<body>
    <div class="header">
        <h1>X.com Tab Selector</h1>
        <p>Customize your Twitter timeline tabs</p>
    </div>
    
    <div class="option-group">
        <div class="option">
            <div class="toggle-container">
                <label for="onlyShowLists">Only show lists</label>
                <div class="toggle-switch" id="onlyShowListsToggle">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="indented-options-container">
        <div class="option-group">
            <div class="option indented" id="hideForYouOption">
                <div class="toggle-container">
                    <label for="hideForYou">Hide "For you"</label>
                    <div class="toggle-switch" id="hideForYouToggle">
                        <div class="toggle-slider"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="option-group">
            <div class="option indented" id="hideFollowingOption">
                <div class="toggle-container">
                    <label for="hideFollowing">Hide "Following"</label>
                    <div class="toggle-switch" id="hideFollowingToggle">
                        <div class="toggle-slider"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    

    
    <script src="popup.js"></script>
</body>
</html>
