<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X.com Tab Selector</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Dark mode styles */
        @media (prefers-color-scheme: dark) {
            body {
                background: #000000 !important;
                color: #ffffff !important;
            }

            .option label, .enabled-row label {
                color: #ffffff !important;
            }

            .disabled-message {
                color: #888888 !important;
            }

            .enabled-row {
                border-bottom-color: #333333 !important;
            }

            .divider {
                background-color: #333333 !important;
            }
        }

        .enabled-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 0;
            border-bottom: 1px solid #e1e8ed;
        }

        .enabled-row input[type="checkbox"] {
            flex-shrink: 0;
        }

        /* Custom checkbox: blue bg + white checkmark */
        input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid #ccc;
            border-radius: 3px;
            background: #fff;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }

        input[type="checkbox"]:checked {
            background: #1da1f2;
            border-color: #1da1f2;
        }

        input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 3px;
            top: 0px;
            width: 4px;
            height: 8px;
            border: 2px solid #fff;
            border-top: none;
            border-left: none;
            transform: rotate(45deg);
        }

        @media (prefers-color-scheme: dark) {
            input[type="checkbox"] {
                border-color: #555;
                background: #111;
            }

            input[type="checkbox"]:checked {
                background: #1da1f2;
                border-color: #1da1f2;
            }
        }

        .enabled-row label {
            font-size: 14px;
            font-weight: 600;
            color: #14171a;
            cursor: pointer;
            flex: 1;
        }

        .disabled-message {
            text-align: center;
            padding: 40px 20px;
            color: #657786;
            font-size: 14px;
            line-height: 1.5;
        }

        .disabled-message .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .content-disabled {
            display: none;
        }

        .content-enabled {
            display: block;
        }

        .option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
            padding: 4px 0;
        }

        .option input[type="checkbox"] {
            flex-shrink: 0;
        }

        .option label {
            font-size: 14px;
            color: #14171a;
            cursor: pointer;
            flex: 1;
        }

        .option-hint {
            font-size: 11px;
            color: #657786;
            margin-top: -6px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        #listSelectorWrapper {
            margin-top: -4px;
            margin-bottom: 12px;
            display: none;
        }

        #selectedList {
            width: 100%;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #ccd6dd;
            font-size: 13px;
            background: #fff;
            color: #14171a;
            cursor: pointer;
        }

        @media (prefers-color-scheme: dark) {
            .option-hint {
                color: #888888;
            }

            #selectedList {
                background: #1a1a1a;
                color: #ffffff;
                border-color: #444;
            }
        }
    </style>
</head>
<body>
    <!-- Extension Enabled -->
    <div class="enabled-row">
        <label for="extensionEnabled">Extension Enabled</label>
        <input type="checkbox" id="extensionEnabled">
    </div>

    <!-- Disabled State -->
    <div id="disabledState" class="disabled-message">
        <div class="icon">🔌</div>
        <div>Extension is currently disabled</div>
        <div style="font-size: 12px; margin-top: 8px;">Enable the extension to customize your Twitter timeline tabs</div>
    </div>

    <!-- Enabled State Content -->
    <div id="enabledState" class="content-enabled">
        <div class="option">
            <label for="makeListDefault">Make your list the default timeline</label>
            <input type="checkbox" id="makeListDefault">
        </div>
        <p class="option-hint">First, pin your list to the home page: click <strong>More</strong> on the left sidebar → <strong>Lists</strong> → click the <strong>Pin</strong> icon next to your list.</p>
        <div id="listSelectorWrapper">
            <select id="selectedList">
                <option value="">— select a list —</option>
            </select>
        </div>

        <div class="option">
            <label for="makeFollowingDefault">Make "Following" the default</label>
            <input type="checkbox" id="makeFollowingDefault">
        </div>

        <!-- Divider -->
        <div class="divider" style="height: 1px; background-color: #e1e8ed; margin: 14px 0;"></div>

        <div class="option">
            <label for="hideForYou">Hide "For you"</label>
            <input type="checkbox" id="hideForYou">
        </div>

        <div class="option">
            <label for="hideFollowing">Hide "Following"</label>
            <input type="checkbox" id="hideFollowing">
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
