<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Default Timeline</title>
    <style>
        /* Colours, type and shapes from X's new design (x-web, checked on
           x.com 2026-11-21): black and white, with black (white in dark mode)
           for the main action, grey secondary text, faint borders and filled
           fields. */
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --text: #000000;
            --secondary: #666666;
            --border: rgba(0, 0, 0, 0.15);
            --fill: rgba(0, 0, 0, 0.04);
            --fill-hover: rgba(0, 0, 0, 0.06);
            --primary: #000000;
            --on-primary: #ffffff;
            --checkbox-border: rgba(0, 0, 0, 0.35);
            --surface: #ffffff;
            --menu-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.15), 0 8px 24px rgba(0, 0, 0, 0.12);
            --warning-text: #7a4f00;
            --warning-bg: #fff6e0;
            --warning-border: rgba(122, 79, 0, 0.25);
            --ease: cubic-bezier(0, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --text: #ffffff;
                --secondary: #999999;
                --border: rgba(255, 255, 255, 0.15);
                --fill: rgba(255, 255, 255, 0.06);
                --fill-hover: rgba(255, 255, 255, 0.1);
                --primary: #ffffff;
                --on-primary: #000000;
                --checkbox-border: rgba(255, 255, 255, 0.4);
                --surface: #141414;
                --menu-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.15), 0 8px 24px rgba(0, 0, 0, 0.6);
                --warning-text: #ffd27a;
                --warning-bg: #241c0a;
                --warning-border: rgba(255, 210, 122, 0.25);
            }
        }

        /* popup.js adds .ready once the saved settings are shown */
        html:not(.ready) *,
        html:not(.ready) *::after {
            transition: none !important;
        }

        body {
            width: 300px;
            margin: 0;
            padding: 4px 20px 12px;
            font-family: TwitterChirp, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;
            line-height: 20px;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        /* Top row: the on/off switch for the whole extension. Each row is a
           <label>, so clicking anywhere on it ticks the box. */
        .enabled-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .enabled-row .row-label {
            flex: 1;
            font-size: 17px;
            font-weight: 700;
        }

        /* Checkboxes: black when ticked (white in dark mode), like X's
           primary buttons */
        input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            position: relative;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            margin: 0;
            border: 2px solid var(--checkbox-border);
            border-radius: 5px;
            background: transparent;
            cursor: pointer;
            transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), scale 0.15s var(--ease);
        }

        /* Hovering anywhere on the row highlights the box */
        input[type="checkbox"]:hover,
        label:hover > input[type="checkbox"] {
            border-color: var(--primary);
        }

        label:active > input[type="checkbox"] {
            scale: 0.96;
        }

        input[type="checkbox"]:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 1px;
            width: 5px;
            height: 10px;
            border: solid var(--on-primary);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        input[type="checkbox"]:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .disabled-message {
            padding: 32px 8px;
            text-align: center;
            color: var(--secondary);
        }

        .disabled-message .title {
            color: var(--text);
            font-weight: 700;
            text-wrap: balance;
        }

        .disabled-message .subtitle {
            margin-top: 4px;
            font-size: 13px;
            line-height: 16px;
            text-wrap: balance;
        }

        .content-enabled {
            display: block;
        }

        .option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 40px;
            cursor: pointer;
        }

        .option .row-label {
            flex: 1;
            font-weight: 500;
        }

        /* Dropdowns: a filled field with a small label above the value */
        .field {
            position: relative;
            display: block;
            margin-bottom: 8px;
            border: 1px solid transparent;
            border-radius: 12px;
            background: var(--fill);
            transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease);
        }

        .field:hover {
            background: var(--fill-hover);
        }

        /* Outline while the menu is open or for keyboard focus, not left
           behind after choosing with the mouse */
        .field:has(select:focus-visible),
        .field:has(select:open) {
            border-color: var(--primary);
            background: transparent;
        }

        /* "No lists yet": grey, and no hover, so it doesn't look clickable */
        .field:has(select:disabled) {
            cursor: default;
        }

        .field:has(select:disabled):hover {
            background: var(--fill);
        }

        .field:has(select:disabled)::after {
            border-color: var(--secondary);
        }

        .field-label {
            position: absolute;
            top: 8px;
            left: 14px;
            font-size: 13px;
            line-height: 16px;
            color: var(--secondary);
            pointer-events: none;
        }

        /* Chevron */
        .field::after {
            content: '';
            position: absolute;
            right: 16px;
            top: 50%;
            width: 6px;
            height: 6px;
            border-right: 2px solid var(--text);
            border-bottom: 2px solid var(--text);
            transform: translateY(-75%) rotate(45deg);
            pointer-events: none;
        }

        .field select {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            margin: 0;
            padding: 26px 38px 9px 14px;
            border: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            outline: none;
        }

        .field select:disabled {
            color: var(--secondary);
            cursor: default;
        }

        .field option {
            color: var(--text);
            background: var(--bg);
        }

        /* The open menu. Chrome 135+ lets a normal <select> be styled with
           appearance: base-select; older versions keep the system menu. */
        @supports (appearance: base-select) {
            .field select,
            .field select::picker(select) {
                appearance: base-select;
            }

            /* .field::after already draws the chevron */
            .field select::picker-icon {
                display: none;
            }

            .field select::picker(select) {
                box-sizing: border-box;
                margin: 6px 0;
                padding: 6px;
                /* Never taller than the room below the field, so the menu
                   stays inside the popup and scrolls instead */
                max-height: calc(100% - 12px);
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: var(--checkbox-border) transparent;
                border: 0;
                border-radius: 16px;
                background: var(--surface);
                box-shadow: var(--menu-shadow);
                color: var(--text);
                font-weight: 500;
            }

            .field option {
                display: flex;
                align-items: center;
                gap: 8px;
                min-height: 40px;
                padding: 0 12px;
                border-radius: 10px;
                background: transparent;
                cursor: pointer;
                transition: background-color 0.15s var(--ease);
            }

            .field option:hover,
            .field option:focus-visible {
                background: var(--fill-hover);
                outline: none;
            }

            .field option:checked {
                font-weight: 700;
            }

            /* "Choose a list or topic" is a prompt, not a list */
            .field option[value=""] {
                color: var(--secondary);
                font-weight: 500;
            }

            /* Tick on the right of the chosen option */
            .field option::checkmark {
                order: 1;
                margin-left: auto;
                content: '✓';
                font-weight: 700;
            }

            .field option:disabled {
                color: var(--secondary);
                cursor: default;
            }

            .field option:disabled:hover {
                background: transparent;
            }

            /* Group headings ("Pinned · opens as a Home tab") */
            /* Chrome insets the heading 6px; add 6px more so it lines up
               with the option text (12px), and pull the options back */
            .field optgroup {
                padding: 8px 6px 0;
                font-size: 13px;
                line-height: 16px;
                font-weight: 500;
                color: var(--secondary);
            }

            .field optgroup:first-of-type {
                padding-top: 4px;
            }

            .field optgroup option {
                margin-inline: -6px;
                font-size: 15px;
                line-height: 20px;
                color: var(--text);
            }

            .field optgroup option:first-of-type {
                margin-top: 4px;
            }
        }

        .option-hint {
            margin: 0 0 16px;
            font-size: 13px;
            line-height: 16px;
            color: var(--secondary);
            text-wrap: pretty;
        }

        .option-hint strong {
            color: var(--text);
        }

        .divider {
            height: 1px;
            margin: 4px 0 8px;
            background: var(--border);
        }

        #listSelectorWrapper {
            display: none;
        }

        .layout-warning {
            display: none;
            margin-bottom: 16px;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 16px;
            color: var(--warning-text);
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            border-radius: 12px;
            text-wrap: pretty;
        }
    </style>
</head>
<body>
    <!-- Extension Enabled -->
    <label class="enabled-row">
        <span class="row-label">Extension on</span>
        <input type="checkbox" id="extensionEnabled" aria-describedby="disabledState">
    </label>

    <!-- Disabled State -->
    <div id="disabledState" class="disabled-message">
        <div class="title">The extension is off</div>
        <div class="subtitle">Tick the box above to choose your default timeline and hide tabs.</div>
    </div>

    <!-- Enabled State Content -->
    <div id="enabledState" class="content-enabled">
        <div id="layoutWarning" class="layout-warning" role="status"></div>
        <label class="field">
            <span class="field-label">Default timeline</span>
            <select id="defaultTimeline">
                <option value="forYou">For you</option>
                <option value="following">Following</option>
                <option value="list">A list or topic</option>
            </select>
        </label>
        <p class="option-hint">X opens on this tab. Reloading or clicking Home keeps the tab you’re on.</p>
        <div id="listSelectorWrapper">
            <label class="field">
                <span class="field-label">List or topic</span>
                <select id="selectedList">
                    <option value="">Choose a list or topic</option>
                </select>
            </label>
        </div>
        <p id="listHint" class="option-hint" style="display: none;">To add a list here, open it once on X.</p>

        <!-- Divider -->
        <div class="divider"></div>

        <label class="option">
            <span class="row-label">Hide “For you”</span>
            <input type="checkbox" id="hideForYou">
        </label>

        <label class="option">
            <span class="row-label">Hide “Following”</span>
            <input type="checkbox" id="hideFollowing">
        </label>
    </div>

    <script src="popup.js"></script>
</body>
</html>
